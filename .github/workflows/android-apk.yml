name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "VipVideo/VipVideo-android/**"
      - "VipVideo/VipVideo-electron/vlist.json"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build installable debug APK
        working-directory: VipVideo/VipVideo-android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VipVideo-android-debug
          path: VipVideo/VipVideo-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
